name: Build

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach files to a GitHub Release on tags

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,   os: ubuntu-latest,  exe: clown_skate_zombie_haul,     archive: tar.gz }
          - { name: windows-x86_64, os: windows-latest, exe: clown_skate_zombie_haul.exe, archive: zip }
          - { name: macos-arm64,    os: macos-latest,   exe: clown_skate_zombie_haul,     archive: tar.gz }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Package
        shell: bash
        run: |
          dir="clown-skate-zombie-haul-${{ matrix.name }}"
          mkdir "$dir"
          cp "target/release/${{ matrix.exe }}" README.md LICENSE "$dir/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$dir.zip" "$dir" > /dev/null
          else
            tar czf "$dir.tar.gz" "$dir"
          fi
          echo "ASSET=$dir.${{ matrix.archive }}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: clown-skate-zombie-haul-${{ matrix.name }}
          path: ${{ env.ASSET }}

  # Publishes the three archives as a public GitHub Release so anyone can
  # download them without a GitHub login. Pushes to main / this branch update
  # the rolling "latest" release; pushing a v* tag makes a permanent release.
  release:
    needs: build
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' && (
        startsWith(github.ref, 'refs/tags/v') ||
        github.ref_name == 'main' ||
        github.ref_name == 'claude/clown-skateboard-zombie-0i0wy6')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$REPO" \
              --title "Clown Skate Zombie Haul $GITHUB_REF_NAME" --generate-notes
          else
            # Rolling release: replace the old one so the tag moves to this commit.
            gh release delete latest --cleanup-tag -y --repo "$REPO" || true
            gh release create latest dist/* --repo "$REPO" --target "$GITHUB_SHA" \
              --title "Latest build" \
              --notes "Automatic build of commit $GITHUB_SHA. Unpack and run clown_skate_zombie_haul."
          fi
