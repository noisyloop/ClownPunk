name: Build

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege: builds only read the repo. Only the release job below can write.
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,     os: ubuntu-latest,  exe: clownpunk }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install ALSA headers (music)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Package
        shell: bash
        run: |
          # Same layout as AudioZero: a flat zip with the program at the top level.
          mkdir dist
          cp "target/release/${{ matrix.exe }}" dist/
          chmod +x "dist/${{ matrix.exe }}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            (cd dist && 7z a -tzip "../clownpunk-${{ matrix.name }}.zip" "${{ matrix.exe }}" > /dev/null)
          else
            (cd dist && zip -9 "../clownpunk-${{ matrix.name }}.zip" "${{ matrix.exe }}")
          fi
          echo "ASSET=clownpunk-${{ matrix.name }}.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: clownpunk-${{ matrix.name }}
          path: ${{ env.ASSET }}

  # Publishes the Linux archive as a public GitHub Release so anyone can
  # download them without a GitHub login. Pushes to main update the rolling
  # "latest" release; pushing a v* tag makes a permanent release.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload the zips
    if: >-
      github.event_name == 'push' && (
        startsWith(github.ref, 'refs/tags/v') ||
        github.ref_name == 'main')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$REPO" \
              --title "ClownPunk $GITHUB_REF_NAME" --generate-notes
          else
            # Rolling release: replace the old one so the tag moves to this commit.
            gh release delete latest --cleanup-tag -y --repo "$REPO" || true
            gh release create latest dist/* --repo "$REPO" --target "$GITHUB_SHA" \
              --title "Latest build" \
              --notes "Automatic build of commit $GITHUB_SHA. Unpack and run clownpunk."
          fi
