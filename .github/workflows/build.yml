name: Build

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach files to a GitHub Release on tags

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,   os: ubuntu-latest,  exe: clown_skate_zombie_haul,     archive: tar.gz }
          - { name: windows-x86_64, os: windows-latest, exe: clown_skate_zombie_haul.exe, archive: zip }
          - { name: macos-arm64,    os: macos-latest,   exe: clown_skate_zombie_haul,     archive: tar.gz }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Package
        shell: bash
        run: |
          dir="clown-skate-zombie-haul-${{ matrix.name }}"
          mkdir "$dir"
          cp "target/release/${{ matrix.exe }}" README.md LICENSE "$dir/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$dir.zip" "$dir" > /dev/null
          else
            tar czf "$dir.tar.gz" "$dir"
          fi
          echo "ASSET=$dir.${{ matrix.archive }}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: clown-skate-zombie-haul-${{ matrix.name }}
          path: ${{ env.ASSET }}

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true
